name: Internal TestFlight

on:
  push:
    tags:
      - 'testflight/*'

concurrency:
  group: internal-testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  source:
    name: Verify protected release source
    if: github.event.created == true && github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, main merge commit, source version and exact-SHA CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -B scripts/testflight_guard.py source --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"

  build:
    name: Build unsigned release archive
    needs: source
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      artifact_id: ${{ steps.transfer.outputs.artifact-id }}
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain and archive without signing credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.6'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17F113'
          python3 -B scripts/verify_release_configuration.py
          xcodebuild -quiet -project PacePrompt.xcodeproj -scheme PacePrompt \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/UnsignedDerivedData" \
            -archivePath "$RUNNER_TEMP/PromptPace.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= archive
      - name: Package unsigned archive with source and run identity
        id: pack
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          digest="$(python3 -B scripts/testflight_handoff.py pack \
            --archive "$RUNNER_TEMP/PromptPace.xcarchive" \
            --package "$RUNNER_TEMP/unsigned-release.zip" \
            --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT")"
          printf 'archive_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Unsigned archive SHA-256: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer unsigned archive only
        id: transfer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ github.run_id }}
          path: ${{ runner.temp }}/unsigned-release.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Sign and upload internal-only build
    needs: [source, build]
    runs-on: macos-26
    timeout-minutes: 120
    environment: internal-testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_TOOLS_SHA: ${{ vars.RELEASE_TOOLS_SHA }}
      TRUSTED_TOOLS_ROOT: ${{ github.workspace }}/trusted
      PACEPROMPT_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/candidate
      ASC_TEAM_ID: ${{ vars.ASC_TEAM_ID }}
      ASC_INTERNAL_GROUP_ID: ${{ vars.ASC_INTERNAL_GROUP_ID }}
      ASC_INTERNAL_TESTER_ID: ${{ vars.ASC_INTERNAL_TESTER_ID }}
      EXPORT_COMPLIANCE_TAG: ${{ vars.EXPORT_COMPLIANCE_TAG }}
    steps:
      - name: Require explicit trusted tools pin before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$RELEASE_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPORT_COMPLIANCE_TAG" = "$RELEASE_TAG"
      - name: Check out independently pinned signing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TOOLS_SHA }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate as source metadata only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Download archive by immutable artifact ID from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/incoming
          merge-multiple: true
      - name: Verify trusted tools, source and archive before using Apple credentials
        shell: bash
        working-directory: trusted
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_TOOLS_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.6'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17F113'
          xcodebuild -help 2>&1 | grep -F 'testFlightInternalTestingOnly' >/dev/null
          python3 -B scripts/testflight_guard.py source --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
          python3 -B scripts/testflight_handoff.py unpack \
            --package "$RUNNER_TEMP/incoming/unsigned-release.zip" \
            --destination "$RUNNER_TEMP/verified" --digest "$ARCHIVE_SHA256" \
            --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          python3 -B scripts/testflight_guard.py unsigned \
            --app "$RUNNER_TEMP/verified/PromptPace.xcarchive/Products/Applications/PacePrompt.app" --tag "$RELEASE_TAG"
      - name: Sign verified archive and upload once using pinned tools
        shell: bash
        working-directory: trusted
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_PROFILE_B64: ${{ secrets.DIST_PROFILE_B64 }}
          DIST_WATCH_PROFILE_B64: ${{ secrets.DIST_WATCH_PROFILE_B64 }}
        run: bash "$TRUSTED_TOOLS_ROOT/scripts/testflight_release.sh"
