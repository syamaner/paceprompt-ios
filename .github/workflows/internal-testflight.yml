name: Internal TestFlight

on:
  push:
    tags:
      - 'testflight/*'

concurrency:
  group: internal-testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  source:
    name: Verify protected release source
    if: github.event.created == true && github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, main merge commit, source version and exact-SHA CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -B scripts/testflight_guard.py source --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"

  release:
    name: Sign and upload internal-only build
    needs: source
    runs-on: macos-26
    timeout-minutes: 120
    environment: internal-testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      ASC_TEAM_ID: ${{ vars.ASC_TEAM_ID }}
      ASC_INTERNAL_GROUP_ID: ${{ vars.ASC_INTERNAL_GROUP_ID }}
      ASC_INTERNAL_TESTER_ID: ${{ vars.ASC_INTERNAL_TESTER_ID }}
      EXPORT_COMPLIANCE_TAG: ${{ vars.EXPORT_COMPLIANCE_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approval, source and pinned toolchain
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXPORT_COMPLIANCE_TAG" = "$RELEASE_TAG"
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.6'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17F113'
          xcodebuild -help 2>&1 | grep -F 'testFlightInternalTestingOnly' >/dev/null
          python3 -B scripts/testflight_guard.py source --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
          python3 -B scripts/verify_release_configuration.py
      - name: Archive, verify, upload once and confirm sole-tester availability
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_PROFILE_B64: ${{ secrets.DIST_PROFILE_B64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_API_KEY_P8_B64"
          test -n "$DIST_P12_B64" && test -n "$DIST_P12_PASSWORD" && test -n "$DIST_PROFILE_B64"
          [[ "$ASC_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          work="$RUNNER_TEMP/testflight"
          key_dir="$HOME/.appstoreconnect/private_keys"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$work" "$key_dir" "$profile_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          keychain="$work/distribution.keychain-db"
          profile_path=''
          cleanup() {
            if [ -n "$profile_path" ]; then rm -f "$profile_path"; fi
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$key_path"
            rm -rf "$work"
          }
          trap cleanup EXIT
          printf '%s' "$ASC_API_KEY_P8_B64" | base64 -D > "$key_path"
          unset ASC_API_KEY_P8_B64
          export ASC_KEY_PATH="$key_path"
          version="${RELEASE_TAG#testflight/}"
          build="${version##*-b}"
          version="${version%-b*}"
          python3 -B scripts/testflight_api.py preflight --version "$version" --build "$build"
          printf '%s' "$DIST_P12_B64" | base64 -D > "$work/distribution.p12"
          printf '%s' "$DIST_PROFILE_B64" | base64 -D > "$work/distribution.mobileprovision"
          unset DIST_P12_B64 DIST_PROFILE_B64
          if [ ! -s "$work/distribution.p12" ] || [ ! -s "$work/distribution.mobileprovision" ]; then
            echo 'FAIL: a signing secret decoded to an empty file' >&2
            exit 1
          fi
          echo 'PASS: signing secret files decoded into restricted temporary storage'
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain" >/dev/null
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/distribution.p12" -k "$keychain" -f pkcs12 \
            -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          unset DIST_P12_PASSWORD keychain_password
          echo 'PASS: temporary signing identity imported'
          security list-keychains -d user -s "$keychain"
          python3 -B scripts/testflight_signing.py \
            --profile "$work/distribution.mobileprovision" \
            --keychain "$keychain" --team "$ASC_TEAM_ID" \
            --output "$work/signing.json"
          profile_uuid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["uuid"])' "$work/signing.json")"
          certificate_sha1="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["certificate_sha1"])' "$work/signing.json")"
          profile_path="$profile_dir/$profile_uuid.mobileprovision"
          cp "$work/distribution.mobileprovision" "$profile_path"
          xcodebuild -quiet -project PacePrompt.xcodeproj -scheme PacePrompt \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$work/PromptPace.xcarchive" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$profile_uuid" archive
          echo 'PASS: Release archive created with manual signing'
          python3 - "$work/export-options.plist" "$ASC_TEAM_ID" "$profile_uuid" "$certificate_sha1" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'wb') as output:
              plistlib.dump({
                  'method': 'app-store-connect', 'destination': 'export',
                  'signingStyle': 'manual', 'teamID': sys.argv[2],
                  'provisioningProfiles': {'com.otherweather.PromptPace': sys.argv[3]},
                  'signingCertificate': sys.argv[4],
                  'manageAppVersionAndBuildNumber': False,
                  'testFlightInternalTestingOnly': True,
              }, output)
          PY
          xcodebuild -quiet -exportArchive -archivePath "$work/PromptPace.xcarchive" \
            -exportPath "$work/export" -exportOptionsPlist "$work/export-options.plist"
          echo 'PASS: internal-only App Store export created'
          ipa="$work/export/PacePrompt.ipa"
          test -f "$ipa"
          mkdir "$work/payload"
          ditto -x -k "$ipa" "$work/payload"
          app="$work/payload/Payload/PacePrompt.app"
          test -d "$app"
          python3 -B scripts/testflight_guard.py artifact --app "$app" \
            --tag "$RELEASE_TAG" --team "$ASC_TEAM_ID" \
            --certificate-sha1 "$certificate_sha1"
          digest="$(shasum -a 256 "$ipa" | awk '{print $1}')"
          printf 'Source SHA: %s\nTag: %s\nBundle: com.otherweather.PromptPace\nVersion/build: %s (%s)\nIPA SHA-256: %s\n' \
            "$RELEASE_SHA" "$RELEASE_TAG" "$version" "$build" "$digest" >> "$GITHUB_STEP_SUMMARY"
          # One upload attempt. A failure is ambiguous until App Store Connect is inspected.
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          printf 'Upload command: accepted; awaiting Apple processing.\n' >> "$GITHUB_STEP_SUMMARY"
          python3 -B scripts/testflight_api.py processed --version "$version" --build "$build"
          printf 'Apple processing: valid. Existing internal group: assigned and observable.\n' >> "$GITHUB_STEP_SUMMARY"
